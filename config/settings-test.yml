# Changing this file necessitates a server restart
name: "The Journal of Open Source Software"
abbreviation: "JOSS"
issn: "2475-9066"
tagline: "a <strong>developer friendly</strong> journal for research software packages."
logo_url: "http://joss.theoj.org/logo_large.png"
url: "http://joss.theoj.org"
editor_email: "joss.theoj@gmail.com"
noreply_email: "noreply@joss.theoj.org"
launch_date: "2016-05-05"
bluesky: "joss-openjournals.bsky.social"
mastodon_url: "https://fosstodon.org/@JOSS"
google_analytics: "UA-47852178-4"
github: "openjournals/joss"
reviews: "openjournals/joss-reviews-testing"
papers_repo: "openjournals/joss-papers-testing"
papers_html_url: "https://www.theoj.org/joss-papers"
reviewers_url: "https://reviewers.joss.theoj.org"
reviewers_signup_url: "https://reviewers.joss.theoj.org/join"
reviewers_lookup_url: "https://reviewers.joss.theoj.org/lookup"
product: "software" # the *thing* being submitted for review
submission_enquiry: |-
  **Project repository URL:** INSERT YOUR REPOSITORY LINK HERE

  Briefly describe your software, its research application and any questions you have about the JOSS submission criteria.
paper_types: []
bot_username: editorialbot
features:
  tracks: true
scope_review:
  enabled: false            # flip on to allow the sweep to run (shadow mode)
  max_repo_size_kb: 1048576 # 1 GB — GitHub API pre-flight threshold before cloning
  clone_timeout: 600        # seconds
  history_commit_cap: 5000  # most-recent commits analyzed for insertion windows
  triage_model: "claude-haiku-4-5"
  investigator_model: "claude-sonnet-5"
  triage_confidence_threshold: 0.75
